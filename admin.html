<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الطلبات</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>إدارة الطلبات</h1><div class="tablewrap"><table><tr><th>الطلب</th><th>الخدمة</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr>{% for o in orders %}<tr><td>{{o.id}}</td><td>{{o.service}}</td><td>{{o.status}}</td><td>{{o.created_at}}</td><td>{% if o.status!="paid" %}<form method="post" action="/admin/{{o.id}}/confirm"><button>تأكيد الدفع</button></form>{% else %}مدفوع{% endif %}</td></tr>{% endfor %}</table></div></main></body></html>
